[package]
name = "whosaid-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dotenvy = "0.15.7"
itertools = "0.15.0"
log = "0.4.27"
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
serenity = { version = "0.12.5", features = ["default", "collector"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
entity = { path = "../entity" }
migration = { path = "../migration" }
