[package]
name = "migration"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dependencies.sea-orm-migration]
version = "2.0.4"
# no default features: the default sea-orm-cli build links OpenSSL (native-tls)
default-features = false
features = [
    "cli",
    "runtime-tokio-rustls",
    "sqlx-postgres",
]
